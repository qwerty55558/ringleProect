# SQLite. Versions 3.8.0 and up are supported.
#   gem install sqlite3
#
#   Ensure the SQLite 3 gem is defined in your Gemfile
#   gem "sqlite3"
#
default: &default
  adapter: sqlite3
  # Falcon multiplexes thousands of connections onto a single fiber
  # event loop, but the SQLite C driver itself isn't fiber-aware — each
  # query executes on a real OS thread. We size the AR pool well above
  # the expected concurrent-query count so fibers never block on
  # connection checkout. With long-lived SSE subscribers and the LLM
  # streaming endpoint, 32 is comfortable headroom.
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 32 } %>
  timeout: 5000
  # WAL (Write-Ahead Logging) lets readers and writers operate
  # concurrently — the default rollback-journal mode serializes ALL
  # access to the database, which would defeat the point of moving to
  # a fiber-based async server. NORMAL synchronous mode is safe in WAL
  # and trades a small durability window for an order of magnitude
  # better write throughput.
  pragmas:
    journal_mode: WAL
    synchronous: NORMAL
    busy_timeout: 5000

development:
  <<: *default
  database: storage/development.sqlite3

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: storage/test.sqlite3


# SQLite3 write its data on the local filesystem, as such it requires
# persistent disks. If you are deploying to a managed service, you should
# make sure it provides disk persistence, as many don't.
#
# Similarly, if you deploy your application as a Docker container, you must
# ensure the database is located in a persisted volume.
production:
  <<: *default
  # database: path/to/persistent/storage/production.sqlite3
